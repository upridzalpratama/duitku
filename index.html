<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Catat pemasukan dan pengeluaran dalam hitungan detik. Offline, tanpa daftar akun, data tetap di HP kamu.">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1416" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Duitku">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Duitku</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <div id="banners"></div>
    <main id="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigasi utama">
    <a class="tab" href="#/" data-tab="home">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Beranda</span>
    </a>
    <a class="tab" href="#/riwayat" data-tab="history">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Riwayat</span>
    </a>
    <button class="fab" id="fab" type="button" aria-label="Catat transaksi baru" data-act="open-sheet">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a class="tab" href="#/laporan" data-tab="reports">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
      <span>Laporan</span>
    </a>
    <a class="tab" href="#/pengaturan" data-tab="settings">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>Pengaturan</span>
    </a>
  </nav>

  <div id="sheet-root"></div>
  <div id="snackbar" role="status" aria-live="polite"><span class="snack-msg"></span><button type="button" class="snack-act"></button></div>
  <div id="confetti-root" aria-hidden="true"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <noscript><p style="padding:24px">Duitku butuh JavaScript supaya bisa jalan.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
